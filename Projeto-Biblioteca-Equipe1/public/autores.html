<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d56">
  <title>Biblioteca — Autores</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="estilo.css?v=4">
</head>

<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

  <header class="topo">
    <div class="topo-conteudo">
      <div class="topo-marca">
        <img class="topo-icone" src="favicon.svg" alt="" width="40" height="40">
        <div>
          <h1 id="titulo-pagina">Carregando...</h1>
          <p class="sub">Cadastro de autores vinculados ao acervo &mdash; API em C++17 + MariaDB</p>
        </div>
      </div>
      <nav id="menu" class="menu" aria-label="Telas do sistema" hidden></nav>
    </div>
  </header>

  <main id="conteudo-principal" class="conteudo">
    <p id="aviso" class="aviso" role="status" hidden></p>

    <section class="cartao">
      <div class="barra">
        <div class="barra-titulo">
          <h2>Autores cadastrados</h2>
          <button type="button" id="btn-novo" class="btn-novo">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path
                d="M10 4a1 1 0 0 1 1 1v4h4a1 1 0 1 1 0 2h-4v4a1 1 0 1 1-2 0v-4H5a1 1 0 1 1 0-2h4V5a1 1 0 0 1 1-1Z" />
            </svg>
            Novo autor
          </button>
        </div>
        <form id="form-busca" class="busca" role="search">
          <input id="busca" type="search" placeholder="Nome ou nacionalidade..." aria-label="Buscar autores">
          <button type="submit">Buscar</button>
          <button type="button" id="limpar-busca" class="secundario">Limpar</button>
        </form>
      </div>
      <div class="rolagem">
        <table id="tabela">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum autor encontrado.</p>
    </section>
  </main>

  <!-- Modal moderno para criar e editar autores -->
  <div id="modal-formulario" class="modal-fundo" role="dialog" aria-modal="true" aria-labelledby="titulo-formulario"
    hidden>
    <div class="modal-cartao">
      <div class="modal-cabecalho">
        <h2 id="titulo-formulario">Novo registro</h2>
        <button type="button" id="fechar-modal" class="btn-fechar" aria-label="Fechar janela">&times;</button>
      </div>
      <p id="aviso-modal" class="aviso" role="alert" hidden></p>
      <form id="formulario" novalidate></form>
    </div>
  </div>

  <!-- Tela de Autores: reutiliza app.js com as definições de config-autores.js -->
  <script src="config-autores.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>

</html>
